<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .pulse-orb {
      animation: floatOrb 8s ease-in-out infinite alternate;
    }
    .pulse-orb2 {
      animation: floatOrb2 10s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 20s linear infinite;
    }
    .pill-card {
      transition: all 0.3s ease;
      animation: gentleFloat 6s ease-in-out infinite alternate;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 30px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-50px, -25px) scale(1.2); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 320; }
    }
    @keyframes gentleFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Kept behind everything) -->
  <g>
    <circle cx="200" cy="120" r="180" fill="url(#orbGrad1)" class="pulse-orb" filter="url(#glow)" />
    <circle cx="1020" cy="280" r="220" fill="url(#orbGrad2)" class="pulse-orb2" filter="url(#glow)" />
    <circle cx="600" cy="200" r="140" fill="url(#orbGrad1)" opacity="0.4" class="pulse-orb" />
  </g>

  <!-- Background Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Dynamic Network Connection Flow Lines in Background -->
  <g stroke="#5865F2" stroke-width="2" opacity="0.25" fill="none" class="flow-line">
    <path d="M 120 80 Q 300 20 600 90 T 1080 70" />
    <path d="M 80 340 Q 400 380 750 320 T 1120 340" stroke="#EC4899" />
    <path d="M 220 320 C 350 180, 850 300, 980 120" stroke="#8B5CF6" />
  </g>

  <!-- Foreground Main Title & Content Structure -->
  <g id="foreground-content">
    <!-- Top Category Tag Pill -->
    <g transform="translate(460, 48)">
      <rect width="280" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="140" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Heading (Bold, crisp, in clear foreground) -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-0.5">
      Awesome Chatbot &amp; Discord Bot Automation
    </text>

    <!-- Subtitle (Clear high-contrast readable text) -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#9ca3af" text-anchor="middle">
      Enterprise SaaS Platforms • Self-Hosted AI Agents • Multi-Channel Messaging Bots
    </text>

    <!-- Horizontal Divider Accent -->
    <line x1="420" y1="225" x2="780" y2="225" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Feature Badge Cards (Foreground, placed comfortably below title without overlap) -->
    <g transform="translate(140, 260)" class="pill-card">
      <!-- Card 1: Discord & Multi-Channel -->
      <g transform="translate(0, 0)">
        <rect width="205" height="76" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
        <rect width="205" height="4" rx="2" fill="#5865F2" />
        <circle cx="35" cy="40" r="14" fill="#5865F2" opacity="0.2" />
        <text x="35" y="46" font-size="16" text-anchor="middle">🤖</text>
        <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f3f4f6">Discord Bots</text>
        <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">discord.js • discord.py</text>
      </g>

      <!-- Card 2: AI Agents & LLMs -->
      <g transform="translate(240, 0)">
        <rect width="205" height="76" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
        <rect width="205" height="4" rx="2" fill="#8B5CF6" />
        <circle cx="35" cy="40" r="14" fill="#8B5CF6" opacity="0.2" />
        <text x="35" y="46" font-size="16" text-anchor="middle">🧠</text>
        <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f3f4f6">AI Agent Workflows</text>
        <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Flowise • Langflow • n8n</text>
      </g>

      <!-- Card 3: Enterprise SaaS -->
      <g transform="translate(480, 0)">
        <rect width="205" height="76" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
        <rect width="205" height="4" rx="2" fill="#EC4899" />
        <circle cx="35" cy="40" r="14" fill="#EC4899" opacity="0.2" />
        <text x="35" y="46" font-size="16" text-anchor="middle">💼</text>
        <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f3f4f6">Hosted SaaS</text>
        <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Intercom • ManyChat • Tidio</text>
      </g>

      <!-- Card 4: Open Source & Self-Hosted -->
      <g transform="translate(720, 0)">
        <rect width="200" height="76" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
        <rect width="200" height="4" rx="2" fill="#10B981" />
        <circle cx="35" cy="40" r="14" fill="#10B981" opacity="0.2" />
        <text x="35" y="46" font-size="16" text-anchor="middle">🔓</text>
        <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f3f4f6">Self-Hosted</text>
        <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Chatwoot • Typebot • Rasa</text>
      </g>
    </g>

    <!-- Bottom Status / Stats Ribbon -->
    <text x="600" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">
      ⭐ Community-Maintained • Constantly Updated • Covers SaaS Pricing, Limits, Frameworks &amp; Star Rankings
    </text>
  </g>
</svg>